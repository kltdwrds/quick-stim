[project]
name = "quick-stim"
version = "0.1.0"
description = "Spotify playlist -> stems -> MIDI pipeline for Logic Pro cover arrangements"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Pinned to what was verified usable as of May 2026.
# Python is capped at <3.12 because basic-pitch's tensorflow wheel
# is not yet available for 3.12 on Apple Silicon as of this writing.
dependencies = [
    "spotdl>=4.2.10",
    "demucs>=4.0.1",
    "basic-pitch>=0.4.0",
    "librosa>=0.10.2",
    "rich>=13.7.0",
    "typer>=0.12.0",
    # 0.2.9 (not 0.2.10) so the `magenta` extra remains installable.
    "pretty-midi>=0.2.9",
    "numpy>=1.26,<2",
    "soundfile>=0.12.1",
    "torch>=2.2",
    "torchaudio>=2.2",
]

[project.optional-dependencies]
# ADTOF is research-grade and finicky to install; keep it optional so the
# base `uv sync` works even when ADTOF wheels don't.
adtof = [
    "ADTOF @ git+https://github.com/MZehren/ADTOF.git",
]
# NOTE: the Magenta fallback (per spec) can NOT be installed as an extra
# here — magenta pins numpy==1.21.6, which conflicts with librosa/demucs.
# If you need Magenta, set it up in a SEPARATE venv per the README; the
# pipeline's drum module will lazily import it if present at runtime.
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
quick-stim = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
